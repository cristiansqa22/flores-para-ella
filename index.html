<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas para Marcela</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle, #ffe6f0 0%, #ffb3d9 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .card {
            background-color: #fffbf2;
            width: 90%;
            max-width: 850px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            padding: 30px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 10;
        }
        @media (max-width: 768px) {
            .card {
                flex-direction: column-reverse;
                padding: 20px;
            }
        }
        .text-container {
            flex: 1;
            padding-right: 20px;
            color: #4a3b32;
        }
        @media (max-width: 768px) {
            .text-container {
                padding-right: 0;
                margin-top: 20px;
                text-align: center;
            }
        }
        h2 {
            font-size: 1.6rem;
            color: #d97706;
            margin-bottom: 15px;
            font-weight: 700;
        }
        p.poem {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 12px;
        }
        .signature {
            font-weight: bold;
            color: #d97706;
            margin-top: 15px;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }
        .timer-title {
            font-size: 0.95rem;
            color: #777;
            margin-bottom: 5px;
        }
        .timer {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            border-bottom: 2px solid #d97706;
            padding-bottom: 5px;
            display: inline-block;
        }
        .canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: transparent;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="text-container">
        <h2>Flores Amarillas para el amor de mi vida </h2>
        <p class="poem">Espero lo resivas con cariño, es estupido que solo de mande esto disculpame.</p>
        <p class="poem">A pesar de todos los problemas, Te Amo mucho🤍</p>
        <div class="signature">— TE AMO MUCHO! VIDA 🤍</div>

        <div class="timer-title">Mi amor por ti comenzó hace... 🌻</div>
        <div class="timer" id="timer">Cargando tiempo...</div>
    </div>
    <div class="canvas-container">
        <canvas id="treeCanvas" width="400" height="420"></canvas>
    </div>
</div>

<script>
    // CONFIGURACIÓN DE LA FECHA INICIAL: 22 DE ENERO DE 2020 (0 = Enero)
    const fechaInicio = new Date(2020, 0, 22, 0, 0, 0);

    function actualizarContador() {
        const ahora = new Date();
        const diferencia = ahora - fechaInicio;

        const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
        const horas = Math.floor((diferencia / (1000 * 60 * 60)) % 24);
        const minutos = Math.floor((diferencia / (1000 * 60)) % 60);
        const segundos = Math.floor((diferencia / 1000) % 60);

        document.getElementById('timer').innerHTML =
            `${dias} días ${horas.toString().padStart(2, '0')} horas ${minutos.toString().padStart(2, '0')} minutos ${segundos.toString().padStart(2, '0')} segundos`;
    }

    // Se actualiza en tiempo real cada 1 segundo (aumentando continuamente)
    setInterval(actualizarContador, 1000);
    actualizarContador();

    // ANIMACIÓN DEL ÁRBOL EN CANVAS
    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');

    function drawSunflower(x, y, radius) {
        ctx.save();
        ctx.translate(x, y);

        // Pétalos amarillos
        ctx.fillStyle = '#fbbf24';
        const petals = 10;
        for (let i = 0; i < petals; i++) {
            ctx.beginPath();
            ctx.rotate((Math.PI * 2) / petals);
            ctx.ellipse(0, radius, radius / 2.5, radius, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        // Centro café del girasol
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.7, 0, Math.PI * 2);
        ctx.fillStyle = '#78350f';
        ctx.fill();
        ctx.restore();
    }

    // Puntos con forma de corazón para la copa del árbol
    const flowers = [];
    for (let t = 0; t < Math.PI * 2; t += 0.05) {
        // Ecuación paramétrica de corazón
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

        // Escalar y centrar en canvas
        for (let r = 0.2; r <= 1; r += 0.2) {
            flowers.push({
                x: 200 + x * 9 * r + (Math.random() * 15 - 7.5),
                y: 160 + y * 9 * r + (Math.random() * 15 - 7.5),
                size: 5 + Math.random() * 4,
                alpha: 0
            });
        }
    }

    // Tronco
    function drawTrunk() {
        ctx.beginPath();
        ctx.moveTo(185, 420);
        ctx.quadraticCurveTo(195, 280, 175, 220);
        ctx.lineTo(225, 220);
        ctx.quadraticCurveTo(205, 280, 215, 420);
        ctx.fillStyle = '#5c3a21';
        ctx.fill();

        // Rama izquierda
        ctx.beginPath();
        ctx.moveTo(185, 250);
        ctx.quadraticCurveTo(150, 210, 130, 190);
        ctx.lineWidth = 8;
        ctx.strokeStyle = '#5c3a21';
        ctx.stroke();

        // Rama derecha
        ctx.beginPath();
        ctx.moveTo(215, 250);
        ctx.quadraticCurveTo(250, 210, 270, 190);
        ctx.lineWidth = 8;
        ctx.strokeStyle = '#5c3a21';
        ctx.stroke();
    }

    // Hojas/girasoles cayendo
    const fallingPetals = [];
    for(let i = 0; i < 25; i++) {
        fallingPetals.push({
            x: 100 + Math.random() * 200,
            y: 100 + Math.random() * 250,
            speedY: 0.5 + Math.random() * 0.8,
            speedX: Math.sin(Math.random()) * 0.5,
            size: 4 + Math.random() * 3
        });
    }

    let progress = 0;
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Suelo
        ctx.beginPath();
        ctx.moveTo(0, 415);
        ctx.lineTo(400, 415);
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#333';
        ctx.stroke();

        drawTrunk();

        // Aparecer flores paulatinamente
        if (progress < flowers.length) {
            progress += 3;
        }

        for (let i = 0; i < progress && i < flowers.length; i++) {
            drawSunflower(flowers[i].x, flowers[i].y, flowers[i].size);
        }

        // Animación de girasoles cayendo
        fallingPetals.forEach(p => {
            drawSunflower(p.x, p.y, p.size);
            p.y += p.speedY;
            p.x += Math.sin(p.y * 0.02) * 0.5;

            if (p.y > 410) {
                p.y = 120 + Math.random() * 50;
                p.x = 120 + Math.random() * 160;
            }
        });

        requestAnimationFrame(animate);
    }

    animate();
</script>
</body>
</html>
